name: Protocol Genesis - Authority Falsification

on:
  pull_request:
    paths:
      - 'tools/authority_build.py'
      - 'tools/authority_propagate_do_check.py'
      - 'tests/test_authority_do_artifacts_consistency.py'
      - 'tests/test_authority_build_fail_closed.py'
      - '.github/workflows/authority-falsification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy pandas
      - name: Test new and original authority decisions
        run: python -m unittest discover -s tests -p 'test_authority_build_fail_closed.py' -v
      - name: Test do-check authority CSV/JSON parity
        run: python -m unittest discover -s tests -p 'test_authority_do_artifacts_consistency.py' -v
